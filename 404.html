<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo - Andamios Aztlán</title>

    <script>
        // Redirección para errores 404 en GitHub Pages
        (function () {

            // Tomamos la URL actual
            var url = new URL(window.location.href);

            // Eliminamos el parámetro fbclid si Facebook lo agregó
            if (url.searchParams.has("fbclid")) {
                url.searchParams.delete("fbclid");
            }

            // Redirigimos al inicio correcto del proyecto
            window.location.replace(
                window.location.origin + "/AztlanMVL/" + url.search + url.hash
            );

        })();
    </script>
</head>
<body>
    <p>Redirigiendo a Andamios Aztlán...</p>
</body>
</html>
